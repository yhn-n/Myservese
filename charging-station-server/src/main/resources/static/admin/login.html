<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — 充电站管理平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/halo.css" />
  <style>
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: radial-gradient(1000px 600px at 70% -10%, rgba(91,107,255,0.10), transparent 60%), var(--color-background);
    }
    .login-card {
      width: 400px; max-width: 90vw; background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg);
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-brand {
      width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-primary);
      display: inline-flex; align-items: center; justify-content: center; color: #fff;
      font-size: 24px; font-weight: 700; margin-bottom: 16px;
    }
    .login-header h1 { font-size: 1.25rem; font-weight: 600; color: var(--color-text-primary); margin: 0 0 4px; }
    .login-header p { font-size: 0.875rem; color: var(--color-text-secondary); margin: 0; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-form .btn-primary { width: 100%; height: 44px; font-size: 0.9375rem; }
    .login-error { color: var(--color-danger); font-size: 0.8125rem; text-align: center; min-height: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand">⚡</div>
      <h1>充电站管理平台</h1>
      <p>请登录管理员账号</p>
    </div>
    <div class="login-form">
      <div class="field">
        <label class="field-label">用户名</label>
        <input class="input" id="username" placeholder="请输入管理员用户名" />
      </div>
      <div class="field">
        <label class="field-label">密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" />
      </div>
      <div class="login-error" id="error"></div>
      <button class="btn btn-primary" onclick="doLogin()">登 录</button>
    </div>
  </div>
  <script>
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      if (!username || !password) { errorEl.textContent = '请输入用户名和密码'; return; }
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();
        if (json.code === 200 && json.data && json.data.token) {
          localStorage.setItem('token', json.data.token);
          localStorage.setItem('admin', JSON.stringify(json.data.admin || {}));
          window.location.href = '/admin/index.html';
        } else {
          errorEl.textContent = json.msg || '登录失败';
        }
      } catch(e) {
        errorEl.textContent = '网络异常，请重试';
        console.error(e);
      }
    }
    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') doLogin();
    });
    // 如果已登录直接跳转
    if (localStorage.getItem('token')) {
      window.location.href = '/admin/index.html';
    }
  </script>
</body>
</html>
